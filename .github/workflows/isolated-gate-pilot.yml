d)\\n    tmp=Path(work)/(\\'identity-diagnostic-tmp-\\'+key);tmp.mkdir(mode=0o777);tmp.chmod(0o777)\\n    return leaf\\n\\ndef prepare_result(work,key):\\n    parent=Path(work)/\\'evidence\\'/(\\'identity_result_\\'+key);parent.mkdir(mode=0o755)\\n    leaf=parent/\\'output.json\\';fd=os.open(leaf,os.O_CREAT|os.O_EXCL|os.O_WRONLY|os.O_NOFOLLOW,0o600)\\n    try:\\n        s=os.fstat(fd)\\n        if not stat.S_ISREG(s.st_mode) or s.st_nlink!=1 or s.st_size:raise ValueError(\\'unsafe result\\')\\n        os.fchmod(fd,0o666)\\n    finally:os.close(fd)\\n    return leaf\\n\\ndef run_bounded(entry,argv,log,seconds,verify,save,launch=subprocess.Popen,clock=time.monotonic,trace_path=None,result_path=None):\\n    \"\"\"Bound raw output in memory; never persist args/env/content/targets.\"\"\"\\n    import selectors\\n    p=None;started=clock();error=None;raw=bytearray();selector=None\\n    entry.update(exit=None,seconds=0,status=\\'not_started\\',timed_out=False)\\n    try:\\n        entry[\\'before\\']=verify();save()\\n        if Path(log).exists():raise ValueError(\\'preserve previous command log\\')\\n        p=launch(argv,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)\\n        entry[\\'status\\']=\\'running\\';save()\\n        selector=selectors.DefaultSelector();selector.register(p.stdout,selectors.EVENT_READ)\\n        eof=False\\n        while not eof or p.poll() is None:\\n            if trace_path is not None:\\n                s=regular(trace_path)\\n                if s.st_nlink!=1 or s.st_size>16384:\\n                    entry[\\'trace_bound_exceeded\\']=True;entry[\\'status\\']=\\'bounded_stop\\';break\\n            if result_path is not None:\\n                s=regular(result_path)\\n                if s.st_nlink!=1 or s.st_size>MAX_LOG:\\n                    entry[\\'result_bound_exceeded\\']=True;entry[\\'status\\']=\\'bounded_stop\\';break\\n            if clock()-started>=seconds or len(raw)>MAX_LOG:\\n                entry[\\'timed_out\\']=clock()-started>=seconds;entry[\\'status\\']=\\'bounded_stop\\';break\\n            for key,_ in selector.select(.1):\\n                chunk=os.read(key.fileobj.fileno(),min(65536,MAX_LOG+1-len(raw)))\\n                if not chunk:eof=True;selector.unregister(key.fileobj)\\n                else:raw.extend(chunk)\\n            if eof and p.poll() is None:time.sleep(.05)\\n    except BaseException as ex:error=ex;entry[\\'error_type\\']=type(ex).__name__\\n    finally:\\n        if selector is not None:selector.close()\\n        if p is not None:\\n            try:\\n                if p.poll() is None:\\n                    os.killpg(p.pid,signal.SIGTERM)\\n                    try:p.wait(timeout=3)\\n                    except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.wait(timeout=3)\\n                entry[\\'exit\\']=p.returncode\\n                try:os.killpg(p.pid,0)\\n                except ProcessLookupError:entry[\\'process_group_gone\\']=True\\n                else:entry[\\'process_group_gone\\']=False\\n            except BaseException as ex:\\n                entry[\\'termination_error_type\\']=type(ex).__name__\\n                if error is None:error=ex\\n            finally:\\n                if p.stdout is not None:p.stdout.close()\\n        entry[\\'seconds\\']=round(clock()-started,6);entry[\\'raw_output_bytes\\']=len(raw)\\n        if p is not None and entry[\\'exit\\'] is not None and entry[\\'status\\']==\\'running\\':entry[\\'status\\']=\\'executed\\'\\n        save() # actual exit/duration before fallible parsing and integrity\\n        if entry.get(\\'stage\\') in NAMES:\\n            try:\\n                result_bytes,result_size=bounded_read(result_path,MAX_LOG)\\n                if result_size!=len(result_bytes) or result_size>MAX_LOG:raise ValueError(\\'result bound\\')\\n                entry[\\'test_result\\']=parse_result(result_bytes.decode(\\'utf8\\'),entry[\\'stage\\'])\\n            except BaseException as ex:entry[\\'result_error_type\\']=type(ex).__name__\\n        # Privacy-minimal command log, not repository stdout; stdout never uploaded.\\n        safe={k:entry.get(k) for k in (\\'stage\\',\\'index\\',\\'exit\\',\\'seconds\\',\\'status\\',\\'timed_out\\',\\'raw_output_bytes\\',\\'test_result\\',\\'result_error_type\\',\\'error_type\\')}\\n        try:\\n            with Path(log).open(\\'x\\') as out:out.write(json.dumps(safe,sort_keys=True)+\\'\\\\n\\')\\n            entry[\\'log_sha256\\']=digest(log);entry[\\'log_bytes\\']=Path(log).stat().st_size\\n        except BaseException as ex:\\n            entry[\\'log_complete\\']=False\\n            if error is None:error=ex\\n        save()\\n        try:entry[\\'after\\']=verify()\\n        except BaseException as ex:\\n            entry[\\'integrity_error_type\\']=type(ex).__name__\\n            if error is None:error=ex\\n        save()\\n    if error is not None:raise error\\n    if entry[\\'timed_out\\'] or entry.get(\\'trace_bound_exceeded\\') or entry.get(\\'result_bound_exceeded\\') or len(raw)>MAX_LOG or not entry.get(\\'process_group_gone\\'):raise RuntimeError(\\'bounded execution incomplete\\')\\n    return entry\\n\\ndef main():\\n    evidence=Path(os.environ[\\'GATE_EVIDENCE\\']);work=Path(os.environ[\\'GATE_WORK\\']);repo=Path(os.environ[\\'GATE_REPO\\']);report_path=evidence/\\'identity_diagnostic_report_v2.json\\'\\n    report={\\'canonical\\':\\'RED unchanged\\',\\'canonical_pass\\':False,\\'environment_only_claim\\':False,\\'commands\\':[],\\'planned_stages\\':[\\'environment\\',\\'probe-T22\\',\\'probe-T24\\',\\'install\\',\\'codec\\',\\'build\\',\\'T22\\',\\'T24\\'],\\'status\\':\\'instrumentation_unproven\\',\\'runtime_gaps\\':[]};failure=None\\n    def save():report_path.write_text(json.dumps(report,indent=2)+\\'\\\\n\\')\\n    def verify():\\n        pins=json.loads((evidence/\\'identity_diagnostic_controls_v2.json\\').read_text())\\n        if digest(evidence/\\'identity_diagnostic_controls_v2.json\\')!=os.environ[\\'IDENTITY_CONTROLS_SHA256\\']:raise ValueError(\\'control manifest drift\\')\\n        for name,h in pins.items():\\n            regular(evidence/name)\\n            if digest(evidence/name)!=h:raise ValueError(\\'control drift\\')\\n        if digest(evidence/\\'identity_diagnostic_manifest.json\\')!=MANIFEST:raise ValueError(\\'observer manifest drift\\')\\n        for name,h in OBSERVER.items():\\n            if digest(evidence/name)!=h:raise ValueError(\\'observer drift\\')\\n        return tracked_snapshot(repo)\\n    save()\\n    try:\\n        report[\\'before\\']=verify()\\n        prep=json.loads((evidence/\\'preparation.json\\').read_text())\\n        if prep.get(\\'status\\')!=\\'complete\\' or len(prep.get(\\'commands\\',[]))!=4 or not prep.get(\\'audit\\',{}).get(\\'audited\\'):raise ValueError(\\'preparation incomplete\\')\\n        for i,c in enumerate(prep[\\'commands\\']):\\n            if c.get(\\'exit\\')!=0 or c.get(\\'status\\')!=\\'passed\\' or c.get(\\'reason\\') or c.get(\\'log_sha256\\')!=digest(evidence/(\\'preparation-\\'+str(i)+\\'.log\\')):raise ValueError(\\'preparation command incomplete\\')\\n        deadline=time.monotonic()+6300 # 105min runtime, 110min step, upload reserve outside\\n        leaves={key:prepare_trace(work,key) for key in NAMES}\\n        results={key:prepare_result(work,key) for key in NAMES}\\n        for stage in [\\'environment\\',\\'probe-T22\\',\\'probe-T24\\',\\'install\\',\\'codec\\',\\'build\\',\\'T22\\',\\'T24\\']:\\n            if time.monotonic()+30>=deadline:raise TimeoutError(\\'runtime budget\\')\\n            index=len(report[\\'commands\\']);entry={\\'stage\\':stage,\\'index\\':index};report[\\'commands\\'].append(entry);save()\\n            leaf=leaves.get(stage)\\n            try:\\n                try:\\n                    run_bounded(entry,[\\'python3\\',str(evidence/\\'identity_diagnostic_wrapper_v2.py\\'),stage],evidence/(\\'identity_diagnostic_command_\\'+str(index)+\\'.log\\'),min(90 if stage in NAMES else 5400,deadline-time.monotonic()-25),verify,save,trace_path=leaf,result_path=results.get(stage))\\n                except RuntimeError:\\n                    if stage not in NAMES or not entry.get(\\'process_group_gone\\') or \\'after\\' not in entry:raise\\n                    entry[\\'bounded_execution_incomplete\\']=True\\n            finally:\\n                if leaf is not None:\\n                    try:\\n                        entry[\\'trace\\']=collect_trace(leaf,stage)\\n                    except BaseException as ex:entry[\\'trace_error_type\\']=type(ex).__name__\\n                    save()\\n            if stage in NAMES:\\n                # Nonzero test exits remain diagnostic outcomes; run T24 separately.\\n                save()\\n            elif entry[\\'exit\\']!=0:raise RuntimeError(\\'prerequisite failed\\')\\n        tests=[e for e in report[\\'commands\\'] if e[\\'stage\\'] in NAMES]\\n        if len(tests)!=2 or not all(execution_complete(e) for e in report[\\'commands\\']) or any(e.get(\\'test_result\\',{}).get(\\'status\\')!=\\'passed\\' or e.get(\\'trace\\',{}).get(\\'status\\')!=POSITIVE or e.get(\\'trace_error_type\\') for e in tests):report[\\'runtime_gaps\\'].append(\\'incomplete_or_unproven\\')\\n        else:report[\\'status\\']=\\'diagnostic_conditional_positive_paths\\'\\n    except BaseException as ex:failure=ex;report[\\'runtime_gaps\\'].append(type(ex).__name__)\\n    finally:\\n        report[\\'unexecuted_stages\\']=[stage for stage in report[\\'planned_stages\\'] if not any(e[\\'stage\\']==stage and e.get(\\'exit\\') is not None for e in report[\\'commands\\'])]\\n        try:\\n            report[\\'after\\']=verify()\\n            integrity={}\\n            for e in report[\\'commands\\']:\\n                name=\\'identity_diagnostic_command_\\'+str(e[\\'index\\'])+\\'.log\\'\\n                integrity[name]=bool(e.get(\\'log_sha256\\')) and digest(evidence/name)==e[\\'log_sha256\\']\\n                if e[\\'stage\\'] in NAMES:\\n                    current=collect_trace(leaves[e[\\'stage\\']],e[\\'stage\\'])\\n                    integrity[e[\\'stage\\']+\\':private_trace\\']=current[\\'sha256\\']==e.get(\\'trace\\',{}).get(\\'sha256\\') and current[\\'bytes\\']==e.get(\\'trace\\',{}).get(\\'bytes\\')\\n            report[\\'final_evidence_integrity\\']=integrity\\n            if not all(integrity.values()):raise ValueError(\\'evidence incomplete or corrupt\\')\\n        except BaseException as ex:report[\\'runtime_gaps\\'].append(\\'final_integrity:\\'+type(ex).__name__);failure=failure or ex;report[\\'status\\']=\\'instrumentation_unproven\\'\\n        save()\\n    try:export_public(work,report)\\n    except BaseException:failure=True;report[\\'status\\']=\\'instrumentation_unproven\\';save()\\n    # Strict incomplete-trace handling is independent of instrumented test pass.\\n    return 1 if failure or report[\\'status\\']==\\'instrumentation_unproven\\' else 0\\nif __name__==\\'__main__\\':raise SystemExit(main())\\n'\nif hashlib.sha256(payload.encode()).hexdigest()!='c520fef801ab55d1edaef6410c25aa423dbfc7e54774db5a2a458d8bef4a8761':raise RuntimeError('own control drift')\nwith (w/'evidence'/'identity_diagnostic_harness_v2.py').open('x') as output:output.write(payload)\npayload='#!/usr/bin/python3\\n\"\"\"V6 base plus separate diagnostic RO-parent/one-RW-leaf mounts.\"\"\"\\nimport os,subprocess,sys,hashlib,json,stat\\nfrom pathlib import Path\\nfrom identity_diagnostic_harness_v2 import command\\n\\ndef diagnostic_mounts(work,stage):\\n    if stage not in (\\'T22\\',\\'T24\\'):return []\\n    root=Path(work);output=root/\\'evidence\\'/(\\'identity_diagnostic_\\'+stage)\\n    leaf=output/\\'events.jsonl\\';tmp=root/(\\'identity-diagnostic-tmp-\\'+stage)\\n    for p in (root,root/\\'evidence\\',output,tmp):\\n        if p.is_symlink() or not p.is_dir():raise ValueError(\\'unsafe diagnostic parent\\')\\n    fd=os.open(leaf,os.O_WRONLY|os.O_APPEND|os.O_NOFOLLOW)\\n    try:\\n        s=os.fstat(fd)\\n        if not stat.S_ISREG(s.st_mode) or s.st_size or s.st_nlink!=1:raise ValueError(\\'fresh regular diagnostic leaf required\\')\\n    finally:os.close(fd)\\n    result=root/\\'evidence\\'/(\\'identity_result_\\'+stage);result_leaf=result/\\'output.json\\'\\n    if result.is_symlink() or not result.is_dir():raise ValueError(\\'unsafe result parent\\')\\n    fd=os.open(result_leaf,os.O_WRONLY|os.O_NOFOLLOW)\\n    try:\\n        s=os.fstat(fd)\\n        if not stat.S_ISREG(s.st_mode) or s.st_size or s.st_nlink!=1:raise ValueError(\\'fresh result leaf required\\')\\n    finally:os.close(fd)\\n    return [\\'--ro-bind\\',str(root/\\'evidence/identity_diagnostic_code\\'),\\'/diag\\',\\'--bind\\',str(tmp),\\'/identity-diagnostic-tmp\\',\\'--ro-bind\\',str(output),\\'/identity-diagnostic-output\\',\\'--bind\\',str(leaf),\\'/identity-diagnostic-output/events.jsonl\\',\\'--ro-bind\\',str(result),\\'/identity-diagnostic-result\\',\\'--bind\\',str(result_leaf),\\'/identity-diagnostic-result/output.json\\']\\n\\n\\nPROBE = r\\'\\'\\'import os,errno,hashlib\\nfrom pathlib import Path\\nfrom identity_diagnostic_harness_v2 import OBSERVER\\nfor p in [\\'/work/evidence/identity_diagnostic_wrapper_v2.py\\',\\'/work/evidence/identity_diagnostic_harness_v2.py\\',\\'/work/evidence/run_isolated.py\\',\\'/repo/.git/config\\',\\'/opt/node/bin/node\\',\\'/work/cargo/bin/rustup\\']:\\n try:fd=os.open(p,os.O_WRONLY)\\n except OSError as e:\\n  assert e.errno in (errno.EROFS,errno.EACCES)\\n else:os.close(fd);raise RuntimeError(\\'writable trusted control\\')\\nfor name in [\\'evidence\\',\\'tools\\',\\'rustup\\',\\'cargo\\',\\'tmp\\',\\'home\\',\\'npm-cache\\',\\'pnpm-store\\',\\'passwd\\',\\'group\\',\\'hosts\\',\\'nsswitch.conf\\']:\\n p=\\'/work/\\'+name\\n try:os.rename(p,p+\\'-identity-negative-probe\\')\\n except OSError as e:assert e.errno in (errno.EROFS,errno.EACCES,errno.EBUSY)\\n else:os.rename(p+\\'-identity-negative-probe\\',p);raise RuntimeError(\\'replaceable bind parent\\')\\nfor name,h in OBSERVER.items():assert hashlib.sha256(Path(\\'/diag\\',name).read_bytes()).hexdigest()==h\\nfor alias in [\\'/usr/lib/x86_64-linux-gnu/libstdc++.so.6\\',\\'/lib/x86_64-linux-gnu/libstdc++.so.6\\']:\\n assert hashlib.sha256(Path(alias).read_bytes()).hexdigest()==\\'7d03c9686574bad9ee3590450fc441481b2ee01c97ee13647a72cad0637143c8\\'\\nfor p in [\\'/diag\\',\\'/identity-diagnostic-output\\',\\'/identity-diagnostic-result\\']:\\n try:fd=os.open(p+\\'/identity-negative-probe\\',os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)\\n except OSError as e:assert e.errno in (errno.EROFS,errno.EACCES)\\n else:os.close(fd);os.unlink(p+\\'/identity-negative-probe\\');raise RuntimeError(\\'writable diagnostic parent\\')\\nleaf=\\'/identity-diagnostic-output/events.jsonl\\'\\nfd=os.open(leaf,os.O_WRONLY|os.O_APPEND|os.O_NOFOLLOW);assert os.fstat(fd).st_size==0;os.close(fd)\\nfor name in [\\'evidence/identity_result_T22\\',\\'evidence/identity_result_T24\\',\\'identity-diagnostic-tmp-T22\\',\\'identity-diagnostic-tmp-T24\\',\\'evidence/identity_diagnostic_T22\\',\\'evidence/identity_diagnostic_T24\\']:\\n p=\\'/work/\\'+name\\n try:os.rename(p,p+\\'-identity-negative-probe\\')\\n except OSError as e:assert e.errno in (errno.EROFS,errno.EACCES,errno.EBUSY)\\n else:os.rename(p+\\'-identity-negative-probe\\',p);raise RuntimeError(\\'replaceable diagnostic host bind source\\')\\nfd=os.open(\\'/identity-diagnostic-result/output.json\\',os.O_WRONLY|os.O_NOFOLLOW);assert os.fstat(fd).st_size==0;os.close(fd)\\nprint(\\'protected diagnostic parents and CXX aliases verified\\')\\n\\'\\'\\'\\n\\ndef verify_controls(work):\\n    evidence=Path(work)/\\'evidence\\'\\n    pins=evidence/\\'identity_diagnostic_controls_v2.json\\'\\n    if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest()!=os.environ[\\'IDENTITY_CONTROLS_SHA256\\']:raise ValueError(\\'control pins drift\\')\\n    for name,h in json.loads(pins.read_text()).items():\\n        p=evidence/name\\n        if p.is_symlink() or not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=h:raise ValueError(\\'frozen control drift\\')\\n    if hashlib.sha256(Path(\\'/usr/bin/bwrap\\').read_bytes()).hexdigest()!=\\'bf6cf3d4456665f5d80c14eb79a76e0ce87b39a0883e614a161658b4ec33492c\\':raise ValueError(\\'bwrap drift\\')\\n\\ndef validate_parents(repo,work,node,tool,rustup):\\n    # No repository-visible writable tree may contain trusted bind-source parents.\\n    for p in [work,node,tool,rustup]:\\n        if p==repo or repo in p.parents:raise ValueError(\\'trusted source under writable repository\\')\\n    for p in [repo,work,node,tool,rustup]:\\n        if Path(\\'/\\')==p:raise ValueError(\\'root bind source denied\\')\\n    if work in repo.parents:raise ValueError(\\'repository inside protected work\\')\\n\\ndef main():\\n    REPO=Path(os.environ[\\'GATE_REPO\\']).resolve()\\n    NODE=Path(os.environ[\\'GATE_NODE\\']).resolve()\\n    TOOL=Path(os.environ[\\'GATE_TOOL\\']).resolve()\\n    WORK=Path(os.environ[\\'GATE_WORK\\']).resolve()\\n    RUSTUP=Path(os.environ[\\'GATE_RUSTUP\\']).resolve()\\n    CXX=WORK/\\'evidence/cxx-prerequisite.bin\\'\\n    if CXX.is_symlink() or not CXX.is_file():raise SystemExit(\\'ordinary pinned C++ prerequisite required\\')\\n    if hashlib.sha256(CXX.read_bytes()).hexdigest()!=\\'7d03c9686574bad9ee3590450fc441481b2ee01c97ee13647a72cad0637143c8\\':raise SystemExit(\\'C++ prerequisite digest mismatch\\')\\n    CXX_DEST=Path(\\'/usr/lib/x86_64-linux-gnu/libstdc++.so.6\\').resolve(strict=True)\\n    if CXX_DEST.parent!=Path(\\'/usr/lib/x86_64-linux-gnu\\') or not CXX_DEST.name.startswith(\\'libstdc++.so.6.\\') or not CXX_DEST.is_file():raise SystemExit(\\'unexpected C++ system-library target\\')\\n    CXX_ALIAS=Path(\\'/lib/x86_64-linux-gnu\\')/CXX_DEST.name\\n    if Path(\\'/lib/x86_64-linux-gnu/libstdc++.so.6\\').resolve(strict=True)!=CXX_DEST:raise SystemExit(\\'unexpected indepe