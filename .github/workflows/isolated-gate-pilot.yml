  "jobs": {
    "canonical-gates": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "steps": [
        {
          "name": "Checkout exact independently reviewed fixture snapshot",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "4acc2caf6877ecdde83d38471aa593fdb06bda0a",
            "persist-credentials": false,
            "fetch-depth": 2
