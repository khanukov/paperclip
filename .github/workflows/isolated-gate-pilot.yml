{
  "name": "Separate identity diagnostic V3 T22/T24 \u2014 canonical RED unchanged",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "reviewed_controls": {
          "description": "Independent parent review must approve these new control bytes; enter the exact digest",
          "required": true,
          "type": "string"
        },
        "diagnostic_only": {
          "description": "Separate fork CI only; never canonical pass",
          "required": true,
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "identity-diagnostic-only": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 193,
      "steps": [
        {
          "name": "Checkout exact independently reviewed fixture snapshot",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "4acc2caf6877ecdde83d38471aa593fdb06bda0a",
            "persist-credentials": false,
            "fetch-depth": 2
          },
          "timeout-minutes": 5
        },
        {
          "name": "Prepare pinned Node runtime",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24.18.0",
            "package-manager-cache": false
          },
          "timeout-minutes": 5
        },
        {
          "name": "Prepare toolchain and offline dependency stores (no repository lifecycle scripts)",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 -I - <<'PYSETUP'\nimport pathlib,os,shutil,subprocess,json,sys,hashlib,functools,base64\nrepo=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()\nw=pathlib.Path(os.environ['RUNNER_TEMP'])/'identity-diagnostic-v3'\nw.mkdir(parents=True,exist_ok=True)\nfor d in ['home','tmp','npm-cache','pnpm-store','evidence','tools','cargo/bin']:(w/d).mkdir(parents=True,exist_ok=True)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='f4c9b362c44951cff9d24c2e3789c437603c9cefa1f2a6d01c591b84ec3b9d99':raise RuntimeError('embedded control drift')\n(w/'evidence'/'run_isolated.py').write_text(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='92088cddbfc3dcde0d179ebc03a296f39acd3857ba688783d106b8f810e5cb28':raise RuntimeError('embedded control drift')\n(w/'evidence'/'gate_runner.py').write_text(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='629b46e2a1bf0334311efb4e1d87e637413b9cf30795191da8c8dd928514d40c':raise RuntimeError('embedded control drift')\n(w/'evidence'/'readonly_controls_probe.py').write_text(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='f5d63c87377e9dce76ca621aa1354af63035d62863295dd3b074e31b81249d09':raise RuntimeError('embedded control drift')\n(w/'evidence'/'approved-baseline-skip-policy.json').write_text(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='f686dd4718c72ce74f934660625ebbaba116e62c7e510dc76059bc8868d851c7':raise RuntimeError('embedded control drift')\n(w/'evidence'/'verifier_membership_v2.mjs').write_text(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='d1d802c23fbc47c517d86b9ae8a874a262b2f283f67cdf7bb385e492c7fa50da':raise RuntimeError('own control drift')\nwith (w/'evidence'/'identity_diagnostic_harness_v3.py').open('x') as output:output.write(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='1f9e86579a94831941b13cd3c9be4c43490936beeb20b96009678259c7391054':raise RuntimeError('own control drift')\nwith (w/'evidence'/'identity_diagnostic_wrapper_v3.py').open('x') as output:output.write(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='d7f8f46c492c9672c462e309b02058f3ff84cabeb81bbd13d296b9867e0f6bae':raise RuntimeError('own control drift')\nwith (w/'evidence'/'identity_diagnostic_core.cjs').open('x') as output:output.write(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='900ee068c0c71f9d0acd67686f2f04b6a66c256f065bf6174928a00bb94cd2ec':raise RuntimeError('own control drift')\nwith (w/'evidence'/'identity_diagnostic_preload.cjs').open('x') as output:output.write(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='1606a35559d4e449c4f1171e85a80b1da2c3028033295c6ab1f65902032e23e0':raise RuntimeError('own control drift')\nwith (w/'evidence'/'identity_diagnostic_manifest.json').open('x') as output:output.write(payload)\npayload=base64.b64decode('').decode(\"utf-8\")\nif hashlib.sha256(payload.encode()).hexdigest()!='37169400f0671602cd8b6be6edb0fa1c6adbd82d247b0cbc22b1a6f247f5c1ac':raise RuntimeError('own control drift')\nwith (w/'evidence'/'build_identity_diagnostic_workflow_v3.py').open('x') as output:output.write(payload)\n(w/'evidence/identity_diagnostic_code').mkdir()\nfor name in ['identity_diagnostic_core.cjs','identity_diagnostic_preload.cjs']:shutil.copyfile(w/'evidence'/name,w/'evidence/identity_diagnostic_code'/name)\nsys.path.insert(0,str(w/'evidence'))\nfrom gate_runner import audit_network_config,Budget,run_command\npreparation={'status':'starting','commands':[]}\ndef save():\n safe=dict(preparation);safe['commands']=[{k:v for k,v in c.items() if k in ('gate','log','status','exit','seconds','log_sha256')} | {'reason':('preparation_incomplete' if c.get('reason') else None)} for c in preparation['commands']]\n for key in ('exception','evidence_save_error'):\n  if key in safe:safe[key]='preparation_incomplete'\n (w/'evidence/preparation.json').write_text(json.dumps(safe,indent=2))\nsave()\nbudget=Budget(3000)\ntry:\n budget.remaining(reserve=25)\n preparation['audit']=audit_network_config(repo)\n budget.remaining(reserve=25);save()\n # Download one fixed official Ubuntu package, verify it, and select ONLY the\n # ordinary binary. No dpkg/apt install, package hooks, profiles or sysctls.\n import urllib.request,tarfile,io,stat,time\n package_url='https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.6.1-1ubuntu0.3_amd64.deb'\n package_sha='706763714e5d19fc7ab2572a6418506e3a4a5d5960e99309707b58117e6b40cb'\n binary_sha='bf6cf3d4456665f5d80c14eb79a76e0ce87b39a0883e614a161658b4ec33492c'\n chunks=[];downloaded=0\n with urllib.request.urlopen(package_url,timeout=budget.remaining(30,reserve=25)) as response:\n  while downloaded<46315:\n   budget.remaining(reserve=25)\n   chunk=response.read1(min(8192,46315-downloaded))\n   if not chunk:break\n   chunks.append(chunk);downloaded+=len(chunk)\n package=b''.join(chunks)\n if len(package)!=46314 or hashlib.sha256(package).hexdigest()!=package_sha:raise RuntimeError('pinned bubblewrap package digest/size mismatch')\n deb=w/'evidence/bwrap-prerequisite.deb';deb.write_bytes(package)\n unpack=subprocess.run(['/usr/bin/dpkg-deb','--fsys-tarfile',str(deb)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=budget.remaining(30,reserve=25),check=True)\n archive=tarfile.open(fileobj=io.BytesIO(unpack.stdout),mode='r:')\n selected=[m for m in archive.getmembers() if m.name in ('./usr/bin/bwrap','usr/bin/bwrap')]\n if len(selected)!=1 or not selected[0].isfile():raise RuntimeError('ordinary unique bwrap binary required')\n body=archive.extractfile(selected[0]).read()\n if len(body)!=72160 or hashlib.sha256(body).hexdigest()!=binary_sha:raise RuntimeError('pinned bubblewrap binary mismatch')\n binary=w/'evidence/bwrap-prerequisite.bin';binary.write_bytes(body);binary.chmod(0o755)\n target=pathlib.Path('/usr/bin/bwrap')\n if target.is_symlink():raise RuntimeError('refuse symlink system tool destination')\n if target.exists():\n  if not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest()!=binary_sha:raise RuntimeError('existing bwrap differs; refuse replacement')\n else:\n  # Privilege is used only to place this verified non-setuid prerequisite at\n  # its standard path. Repository code still runs as the original uid1000\n  # with unchanged bwrap flags, credential isolation and network denial.\n  subprocess.run(['/usr/bin/sudo','-n','/usr/bin/install','-o','root','-g','root','-m','0755',str(binary),str(target)],check=True,timeout=budget.remaining(30,reserve=25))\n metadata=target.stat()\n if stat.S_IMODE(metadata.st_mode)!=0o755 or metadata.st_uid!=0 or metadata.st_gid!=0 or hashlib.sha256(target.read_bytes()).hexdigest()!=binary_sha:raise RuntimeError('installed prerequisite integrity/mode mismatch')\n if 'security.capability' in os.listxattr(target):raise RuntimeError('file capabilities forbidden')\n version=subprocess.run([str(target),'--version'],capture_output=True,text=True,check=True,timeout=budget.remaining(10,reserve=25))\n receipt={'package_url':package_url,'package_sha256':package_sha,'binary_sha256':binary_sha,'mode':'0755','setuid':False,'file_capabilities':False,'target':str(target),'version':version.stdout.strip(),'package_install_scripts_executed':False,'apparmor_or_sysctl_changes':False,'source_or_product_dependency_changes':False}\n (w/'evidence/bwrap-prerequisite.json').write_text(json.dumps(receipt,indent=2));preparation['bwrap_prerequisite']=receipt;save()\n # Isolated compiler ABI prerequisite; never replace any host library.\n cxx_url='https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu/pool/main/g/gcc-16/libstdc++6_16-20260315-1ubuntu1~22~ppa1_amd64.deb';cxx_package_sha='5f20f14daccdf4bcf6c409cac46e37e4571c1347b1a60ec8201e3f7f9482d756';cxx_sha='7d03c9686574bad9ee3590450fc441481b2ee01c97ee13647a72cad0637143c8'\n chunks=[];downloaded=0\n with urllib.request.urlopen(cxx_url,timeout=budget.remaining(30,reserve=25)) as response:\n  while downloaded<877411:\n   budget.remaining(reserve=25)\n   chunk=response.read1(min(65536,877411-downloaded))\n   if not chunk:break\n   chunks.append(chunk);downloaded+=len(chunk)\n package=b''.join(chunks)\n if len(package)!=877410 or hashlib.sha256(package).hexdigest()!=cxx_package_sha:raise RuntimeError('pinned C++ package mismatch')\n deb=w/'evidence/cxx-prerequisite.deb';deb.write_bytes(package)\n unpack=subprocess.run(['/usr/bin/dpkg-deb','--fsys-tarfile',str(deb)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=budget.remaining(30,reserve=25),check=True)\n archive=tarfile.open(fileobj=io.BytesIO(unpack.stdout),mode='r:')\n selected=[m for m in archive.getmembers() if m.name=='./usr/lib/x86_64-linux-gnu/libstdc++.so.6.0.35']\n if len(selected)!=1 or not selected[0].isfile():raise RuntimeError('ordinary unique C++ runtime required')\n body=archive.extractfile(selected[0]).read()\n if len(body)!=2739728 or hashlib.sha256(body).hexdigest()!=cxx_sha:raise RuntimeError('pinned C++ binary mismatch')\n library=w/'evidence/cxx-prerequisite.bin';library.write_bytes(body);library.chmod(0o644)\n receipt={'package_url':cxx_url,'package_sha256':cxx_package_sha,'binary_sha256':cxx_sha,'version':'16-20260315-1ubuntu1~22~ppa1','host_library_replaced':False,'binding':'read-only library overlay in repository sandbox only','LD_LIBRARY_PATH_set':False,'package_scripts_executed':False,'security_policy_modified':False}\n (w/'evidence/cxx-prerequisite.json').write_text(json.dumps(receipt,indent=2));preparation['cxx_prerequisite']=receipt;save()\n node=pathlib.Path(shutil.which('node')).resolve().parent.parent\n rustup_home=w/'rustup'\n rustup_binary=pathlib.Path(shutil.which('rustup')).resolve()\n shutil.copy2(rustup_binary,w/'cargo/bin/rustup')\n for name in ['cargo','rustc','rustdoc']:(w/'cargo/bin'/name).symlink_to('rustup')\n for rc_name in ['npm-user.rc','npm-global.rc']:\n  rc=w/'home'/rc_name\n  if rc.exists() or rc.is_symlink():raise RuntimeError('fresh npm config required')\n  rc.write_text('');rc.chmod(0o600)\n env={'PATH':str(node/'bin')+':'+str(w/'cargo/bin')+':/usr/local/bin:/usr/bin:/bin','HOME':str(w/'home'),'RUSTUP_HOME':str(rustup_home),'RUSTUP_TOOLCHAIN':'1.97.1','CARGO_HOME':str(w/'cargo'),'npm_config_cache':str(w/'npm-cache'),'npm_config_audit':'false','npm_config_fund':'false','npm_config_userconfig':str(w/'home/npm-user.rc'),'npm_config_globalconfig':str(w/'home/npm-global.rc'),'npm_config_ignore_scripts':'true','LANG':'C.UTF-8','GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null','GIT_TERMINAL_PROMPT':'0','CARGO_NET_GIT_FETCH_WITH_CLI':'false'}\n commands=[['rustup','toolchain','install','1.97.1','--profile','minimal','--component','rustfmt'],['npm','install','--ignore-scripts','--prefix',str(w/'tools'),'pnpm@9.15.4'],[str(w/'tools/node_modules/.bin/pnpm'),'fetch','--frozen-lockfile','--ignore-scripts','--ignore-pnpmfile','--store-dir',str(w/'pnpm-store')],['cargo','fetch','--locked','--manifest-path',str(repo/'packages/paperclip-runner/runner/Cargo.toml')]]\n for index,args in enumerate(commands):\n  budget.remaining(reserve=25)\n  log=w/'evidence'/('preparation-'+str(index)+'.log')\n  entry={'gate':'preparation-'+str(index),'command':args,'log':str(log),'status':'incomplete','exit':None,'reason':'not_started','seconds':0,'log_sha256':None}\n  preparation['commands'].append(entry);save()\n  run_command(entry,args,log,budget,lambda:audit_network_config(repo),lambda t:{'green':True},save,lambda:shutil.disk_usage(repo).free,limit=1200,launch=functools.partial(subprocess.Popen,cwd=repo,env=env))\n  if entry['exit']!=0:raise RuntimeError('network preparation command failed')\n preparation['status']='complete';save()\nexcept BaseException as error:\n preparation.update(status='blocked',exception=repr(error))\n try:save()\n except BaseException as secondary:preparation['evidence_save_error']=repr(secondary)\n raise SystemExit(1)\nvariables={'GATE_REPO':str(repo),'GATE_NODE':str(node),'GATE_TOOL':str(w/'tools'),'GATE_WORK':str(w),'GATE_RUSTUP':str(rustup_home),'GATE_EVIDENCE':str(w/'evidence'),'GATE_WRAPPER':str(w/'evidence/run_isolated.py'),'GATE_MANIFEST_SHA256':'f8f12148e873d79223fd707e43254b69c338b982f536cd43e5b5fab2e367e6db','GATE_TARGET_COMMIT':'4acc2caf6877ecdde83d38471aa593fdb06bda0a','GATE_BASE_COMMIT':'2bfee409b407e97a8d3a62488f70b0ebfabe6cac','GATE_DIFF_SHA256':'933f5e869564e782c3d4dd028be20fda841c19ed6800421ed4303ce088e66ed1'}\nwith open(os.environ['GITHUB_ENV'],'a') as f:\n for key,value in variables.items():f.write(key+'='+value+'\\n')\npins={'identity_diagnostic_harness_v3.py': 'd1d802c23fbc47c517d86b9ae8a874a262b2f283f67cdf7bb385e492c7fa50da', 'identity_diagnostic_wrapper_v3.py': '1f9e86579a94831941b13cd3c9be4c43490936beeb20b96009678259c7391054', 'identity_diagnostic_core.cjs': 'd7f8f46c492c9672c462e309b02058f3ff84cabeb81bbd13d296b9867e0f6bae', 'identity_diagnostic_preload.cjs': '900ee068c0c71f9d0acd67686f2f04b6a66c256f065bf6174928a00bb94cd2ec', 'identity_diagnostic_manifest.json': '1606a35559d4e449c4f1171e85a80b1da2c3028033295c6ab1f65902032e23e0', 'build_identity_diagnostic_workflow_v3.py': '37169400f0671602cd8b6be6edb0fa1c6adbd82d247b0cbc22b1a6f247f5c1ac', 'run_isolated.py': 'f4c9b362c44951cff9d24c2e3789c437603c9cefa1f2a6d01c591b84ec3b9d99', 'gate_runner.py': '92088cddbfc3dcde0d179ebc03a296f39acd3857ba688783d106b8f810e5cb28', 'readonly_controls_probe.py': '629b46e2a1bf0334311efb4e1d87e637413b9cf30795191da8c8dd928514d40c', 'approved-baseline-skip-policy.json': 'f5d63c87377e9dce76ca621aa1354af63035d62863295dd3b074e31b81249d09', 'verifier_membership_v2.mjs': 'f686dd4718c72ce74f934660625ebbaba116e62c7e510dc76059bc8868d851c7', 'identity_diagnostic_code/identity_diagnostic_core.cjs': 'd7f8f46c492c9672c462e309b02058f3ff84cabeb81bbd13d296b9867e0f6bae', 'identity_diagnostic_code/identity_diagnostic_preload.cjs': '900ee068c0c71f9d0acd67686f2f04b6a66c256f065bf6174928a00bb94cd2ec', 'cxx-prerequisite.bin': '7d03c9686574bad9ee3590450fc441481b2ee01c97ee13647a72cad0637143c8', 'bwrap-prerequisite.bin': 'bf6cf3d4456665f5d80c14eb79a76e0ce87b39a0883e614a161658b4ec33492c'}\nfor name in ['preparation.json','bwrap-prerequisite.json','cxx-prerequisite.json',*[f'preparation-{i}.log' for i in range(4)]]:pins[name]=hashlib.sha256((w/'evidence'/name).read_bytes()).hexdigest()\ncontrols=json.dumps(pins,sort_keys=True)+'\\n'\nwith (w/'evidence/identity_diagnostic_controls_v3.json').open('x') as output:output.write(controls)\ncontrols_sha=hashlib.sha256(controls.encode()).hexdigest()\nwith open(os.environ['GITHUB_ENV'],'a') as f:f.write('IDENTITY_CONTROLS_SHA256='+controls_sha+'\\n')\nPYSETUP\n",
          "timeout-minutes": 55
        },
        {
          "name": "Separate offline diagnostic only \u2014 prerequisites/build then exact T22 and T24",
          "shell": "bash",
          "run": "python3 \"$GATE_EVIDENCE/identity_diagnostic_harness_v3.py\"",
          "timeout-minutes": 110,
          "id": "diagnostic_runtime"
        },
        {
          "name": "Validate strict public receipt; quarantine everything else",
          "id": "identity_bounds",
          "if": "always()",
          "shell": "bash",
          "timeout-minutes": 3,
          "run": "python3 -I -B - <<'PYBOUNDS'\nimport os,sys,pathlib,hashlib\np=pathlib.Path(os.environ['GATE_EVIDENCE'])\nh=p/'identity_diagnostic_harness_v3.py'\nif h.is_symlink() or hashlib.sha256(h.read_bytes()).hexdigest()!='d1d802c23fbc47c517d86b9ae8a874a262b2f283f67cdf7bb385e492c7fa50da':raise SystemExit(1)\nsys.path.insert(0,str(p))\nfrom identity_diagnostic_harness_v3 import validate_export,bounded_read,strict_json\nbounded=validate_export(pathlib.Path(os.environ['GATE_WORK'])/'validated-export-v3')\nif bounded:\n receipt,_=bounded_read(pathlib.Path(os.environ['GATE_WORK'])/'validated-export-v3/receipt.json',16384)\n if strict_json(receipt)['status']=='diagnostic_conditional_positive_paths' and os.environ.get('DIAGNOSTIC_RUNTIME_OUTCOME')!='success':bounded=False\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('bounded='+str(bounded).lower()+'\\n')\nraise SystemExit(0 if bounded else 1)\nPYBOUNDS\n",
          "env": {
            "DIAGNOSTIC_RUNTIME_OUTCOME": "${{ steps.diagnostic_runtime.outcome }}"
          }
        },
        {
          "name": "Preserve actual gate evidence",
          "if": "always() && steps.identity_bounds.outputs.bounded == 'true'",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "identity-diagnostic-validated-v3-${{ github.run_id }}",
            "path": "${{ runner.temp }}/identity-diagnostic-v3/validated-export-v3/receipt.json",
            "retention-days": 14,
            "if-no-files-found": "error"
          },
          "timeout-minutes": 10
        }
      ],
      "if": "${{ github.event_name == 'workflow_dispatch' && github.event.repository.fork == true && github.ref == 'refs/heads/verify/identity-diagnostic-v3-20261013' && inputs.diagnostic_only && inputs.reviewed_controls == '8bb90e021556221122827ec9607c5d38d5e597f899d962bd520bfd281d707a01' }}"
    }
  },
  "concurrency": {
    "group": "identity-diagnostic-v3-${{ github.run_id }}",
    "cancel-in-progress": false
  }
}
