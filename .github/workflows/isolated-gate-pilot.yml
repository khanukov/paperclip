{
  "name": "Offline exact-snapshot pipeline gates",
  "on": {
    "push": {
      "branches": [
        "verify/pipeline-gate-environment"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "canonical-gates": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 330,
      "steps": [
        {
          "name": "Checkout exact reviewed solution commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "2bfee409b407e97a8d3a62488f70b0ebfabe6cac",
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Prepare pinned Node runtime",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24.18.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Prepare toolchain and offline dependency stores (no repository lifecycle scripts)",
          "shell": "bash",
          "run": "set -euo pipefail\ncommand -v bwrap || { sudo apt-get update; sudo apt-get install --no-install-recommends -y bubblewrap; }\npython3 - <<'PYSETUP'\nimport pathlib,os,shutil,subprocess,json\nrepo=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()\nw=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue10311'\nw.mkdir(parents=True,exist_ok=True)\nfor d in ['home','tmp','npm-cache','pnpm-store','evidence','tools','cargo/bin']:(w/d).mkdir(parents=True,exist_ok=True)\nnode=pathlib.Path(shutil.which('node')).resolve().parent.parent\nrustup_home=pathlib.Path(os.environ.get('RUSTUP_HOME',str(pathlib.Path.home()/'.rustup'))).resolve()\nrustup_binary=pathlib.Path(shutil.which('rustup')).resolve()\nshutil.copy2(rustup_binary,w/'cargo/bin/rustup')\nfor name in ['cargo','rustc','rustdoc']:(w/'cargo/bin'/name).symlink_to('rustup')\nenv={'PATH':str(node/'bin')+':'+str(w/'cargo/bin')+':/usr/local/bin:/usr/bin:/bin','HOME':str(w/'home'),'RUSTUP_HOME':str(rustup_home),'CARGO_HOME':str(w/'cargo'),'npm_config_cache':str(w/'npm-cache'),'npm_config_audit':'false','npm_config_fund':'false','LANG':'C.UTF-8'}\ncommands=[['npm','install','--ignore-scripts','--prefix',str(w/'tools'),'pnpm@9.15.4'],[str(w/'tools/node_modules/.bin/pnpm'),'fetch','--frozen-lockfile','--ignore-scripts','--store-dir',str(w/'pnpm-store')],['cargo','fetch','--locked','--manifest-path',str(repo/'packages/paperclip-runner/runner/Cargo.toml')]]\nresults=[]\nfor args in commands:\n p=subprocess.run(args,cwd=repo,env=env);results.append({'command':args,'exit':p.returncode});(w/'evidence/preparation.json').write_text(json.dumps(results,indent=2));p.check_returncode()\nvariables={'GATE_REPO':str(repo),'GATE_NODE':str(node),'GATE_TOOL':str(w/'tools'),'GATE_WORK':str(w),'GATE_RUSTUP':str(rustup_home),'GATE_EVIDENCE':str(w/'evidence'),'GATE_WRAPPER':str(w/'evidence/run_isolated.py'),'GATE_MANIFEST_SHA256':'2dc7b5909f9e3f4e7a163ccfd00637b8284716509e8acabc63dc6533fca89c1c'}\nwith open(os.environ['GITHUB_ENV'],'a') as f:\n for key,value in variables.items():f.write(key+'='+value+'\\n')\n(w/'evidence/run_isolated.py').write_text('#!/usr/bin/python3\\n\"\"\"Approved bwrap layout adapted to an ephemeral offline gate runner.\\nNo host home, credentials, ambient environment, network or security overrides.\\n\"\"\"\\nimport os,subprocess,sys\\nfrom pathlib import Path\\nREPO=Path(os.environ[\\'GATE_REPO\\']).resolve()\\nNODE=Path(os.environ[\\'GATE_NODE\\']).resolve()\\nTOOL=Path(os.environ[\\'GATE_TOOL\\']).resolve()\\nWORK=Path(os.environ[\\'GATE_WORK\\']).resolve()\\nRUSTUP=Path(os.environ[\\'GATE_RUSTUP\\']).resolve()\\nfor p in [TOOL,WORK,*[WORK/x for x in [\\'home\\',\\'tmp\\',\\'npm-cache\\',\\'pnpm-store\\',\\'evidence\\']]]:p.mkdir(parents=True,exist_ok=True)\\n(WORK/\\'passwd\\').write_text(\\'paperclip:x:1000:1000:Isolated test user:/work/home:/bin/sh\\\\n\\')\\n(WORK/\\'group\\').write_text(\\'paperclip:x:1000:\\\\n\\')\\n(WORK/\\'hosts\\').write_text(\\'127.0.0.1 localhost\\\\n::1 localhost\\\\n\\')\\n(WORK/\\'nsswitch.conf\\').write_text(\\'passwd: files\\\\ngroup: files\\\\nhosts: files dns\\\\n\\')\\nargs=sys.argv[1:]\\nif not args or args[0]==\\'--network\\':raise SystemExit(\\'offline command required\\')\\ncmd=[\\'bwrap\\',\\'--unshare-user\\',\\'--uid\\',\\'1000\\',\\'--gid\\',\\'1000\\',\\'--unshare-pid\\',\\'--unshare-ipc\\',\\'--unshare-uts\\',\\'--unshare-cgroup\\',\\'--die-with-parent\\',\\'--new-session\\',\\'--unshare-net\\']\\ncmd+=[\\'--ro-bind\\',\\'/usr\\',\\'/usr\\',\\'--tmpfs\\',\\'/usr/local\\',\\'--dir\\',\\'/usr/local/bin\\',\\'--symlink\\',\\'/opt/node/bin/node\\',\\'/usr/local/bin/node\\',\\'--symlink\\',\\'/opt/tools/node_modules/.bin/pnpm\\',\\'/usr/local/bin/pnpm\\',\\'--ro-bind\\',\\'/lib\\',\\'/lib\\',\\'--ro-bind\\',\\'/lib64\\',\\'/lib64\\',\\'--symlink\\',\\'usr/bin\\',\\'/bin\\',\\'--proc\\',\\'/proc\\',\\'--dev\\',\\'/dev\\',\\'--bind\\',str(WORK/\\'tmp\\'),\\'/tmp\\',\\'--tmpfs\\',\\'/root\\',\\'--dir\\',\\'/etc\\',\\'--ro-bind\\',\\'/etc/ssl/certs\\',\\'/etc/ssl/certs\\',\\'--ro-bind\\',\\'/etc/alternatives\\',\\'/etc/alternatives\\']\\ncmd+=[\\'--ro-bind\\',str(WORK/\\'passwd\\'),\\'/etc/passwd\\',\\'--ro-bind\\',str(WORK/\\'group\\'),\\'/etc/group\\',\\'--ro-bind\\',str(WORK/\\'hosts\\'),\\'/etc/hosts\\',\\'--ro-bind\\',str(WORK/\\'nsswitch.conf\\'),\\'/etc/nsswitch.conf\\',\\'--ro-bind\\',str(NODE),\\'/opt/node\\',\\'--ro-bind\\',str(RUSTUP),\\'/opt/rustup\\',\\'--bind\\',str(TOOL),\\'/opt/tools\\',\\'--bind\\',str(REPO),\\'/repo\\',\\'--bind\\',str(WORK),\\'/work\\',\\'--chdir\\',\\'/repo\\',\\'--clearenv\\']\\nenv={\\'PATH\\':\\'/work/cargo/bin:/opt/tools/node_modules/.bin:/opt/node/bin:/repo/node_modules/.bin:/usr/local/bin:/usr/bin:/bin\\',\\'RUSTUP_HOME\\':\\'/opt/rustup\\',\\'CARGO_HOME\\':\\'/work/cargo\\',\\'CARGO_NET_OFFLINE\\':\\'true\\',\\'CARGO_BUILD_JOBS\\':\\'2\\',\\'CARGO_PROFILE_DEV_DEBUG\\':\\'0\\',\\'CARGO_PROFILE_TEST_DEBUG\\':\\'0\\',\\'CC\\':\\'/usr/bin/gcc\\',\\'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER\\':\\'/usr/bin/gcc\\',\\'HOME\\':\\'/work/home\\',\\'USERPROFILE\\':\\'/work/home\\',\\'TMPDIR\\':\\'/work/tmp\\',\\'LANG\\':\\'C.UTF-8\\',\\'LC_ALL\\':\\'C.UTF-8\\',\\'HUSKY\\':\\'0\\',\\'npm_config_cache\\':\\'/work/npm-cache\\',\\'npm_config_userconfig\\':\\'/work/home/npm-user.rc\\',\\'npm_config_globalconfig\\':\\'/work/home/npm-global.rc\\',\\'npm_config_audit\\':\\'false\\',\\'npm_config_fund\\':\\'false\\',\\'PNPM_HOME\\':\\'/opt/tools/node_modules/.bin\\',\\'npm_config_store_dir\\':\\'/work/pnpm-store\\',\\'RAYON_NUM_THREADS\\':\\'2\\',\\'UV_THREADPOOL_SIZE\\':\\'2\\',\\'NODE_OPTIONS\\':\\'--max-old-space-size=3072\\',\\'CI\\':\\'true\\',\\'NO_COLOR\\':\\'1\\',\\'GIT_CONFIG_NOSYSTEM\\':\\'1\\',\\'GIT_CONFIG_GLOBAL\\':\\'/dev/null\\',\\'GIT_TERMINAL_PROMPT\\':\\'0\\',\\'GIT_DISCOVERY_ACROSS_FILESYSTEM\\':\\'1\\'}\\nfor k,v in env.items():cmd+=[\\'--setenv\\',k,v]\\ncmd+=[\\'--\\',*args]\\nraise SystemExit(subprocess.run(cmd).returncode)\\n')\n(w/'evidence/gate_runner.py').write_text('#!/usr/bin/python3\\n\"\"\"Exact-commit offline gate driver on an ephemeral compatible runner.\"\"\"\\nimport hashlib,json,os,re,shutil,signal,subprocess,time\\nfrom pathlib import Path\\nR=Path(os.environ[\\'GATE_EVIDENCE\\'])\\nR.mkdir(parents=True,exist_ok=True)\\nREPO=Path(os.environ[\\'GATE_REPO\\'])\\nSHA=\\'2bfee409b407e97a8d3a62488f70b0ebfabe6cac\\'\\nBASE=\\'1b4c803816e82b0265c8422e1a804327a7ed8c54\\'\\nDIFF=\\'1f63f57d4d8bcd4f8be3159f874712f6c9095b8038caf6e24aa1f1672db851ac\\'\\nEXPECTED_MANIFEST=os.environ[\\'GATE_MANIFEST_SHA256\\']\\nWRAPPER=Path(os.environ[\\'GATE_WRAPPER\\'])\\nreport={\\'status\\':\\'starting\\',\\'commit\\':SHA,\\'base\\':BASE,\\'reviewed_diff_sha256\\':DIFF,\\'gates\\':[],\\'security_policy_modified\\':False,\\'network_for_repository_code\\':False}\\ndef save(): (R/\\'gate-recovery.json\\').write_text(json.dumps(report,indent=2))\\ndef git(*args):return subprocess.check_output([\\'git\\',\\'-C\\',str(REPO),*args])\\ndef verify():\\n    assert git(\\'rev-parse\\',\\'HEAD\\').decode().strip()==SHA\\n    assert git(\\'rev-parse\\',\\'HEAD^\\').decode().strip()==BASE\\n    assert hashlib.sha256(git(\\'diff\\',BASE,SHA,\\'--binary\\')).hexdigest()==DIFF\\n    assert not git(\\'diff\\',\\'--name-only\\').strip() and not git(\\'diff\\',\\'--cached\\',\\'--name-only\\').strip()\\n    manifest={}\\n    for f in git(\\'ls-files\\',\\'-z\\').decode().split(\\'\\\\0\\'):\\n        if f and (REPO/f).is_file():manifest[f]=hashlib.sha256((REPO/f).read_bytes()).hexdigest()\\n    digest=hashlib.sha256(json.dumps(manifest,sort_keys=True).encode()).hexdigest()\\n    assert digest==EXPECTED_MANIFEST,(digest,EXPECTED_MANIFEST)\\n    return {\\'commit\\':SHA,\\'parent\\':BASE,\\'diff_sha256\\':DIFF,\\'tracked_manifest_sha256\\':digest,\\'tracked_files\\':len(manifest),\\'tracked_bytes_match\\':True,\\'unstaged_clean\\':True}\\ntry:\\n    report[\\'snapshot_before\\']=verify();save()\\n    commands=[(\\'environment-prerequisites\\',[\\'sh\\',\\'-c\\',\\'set -eu; awk \"BEGIN {print 1}\"; PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/env node --version; bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true; test ! -e /root/.config/gh/hosts.yml; test ! -e /home/runner/.config/gh/hosts.yml; python3 -c \"import socket; print(socket.if_nameindex()); assert len(socket.if_nameindex()) <= 1\"\\']),(\\'install-offline\\',[\\'pnpm\\',\\'install\\',\\'--offline\\',\\'--frozen-lockfile\\',\\'--ignore-scripts\\',\\'--store-dir\\',\\'/work/pnpm-store\\']),(\\'focused\\',[\\'pnpm\\',\\'exec\\',\\'vitest\\',\\'run\\',\\'--exclude\\',\\'**/dist/**\\',\\'server/src/__tests__/pipelines-routes.test.ts\\',\\'server/src/__tests__/pipelines-service.test.ts\\',\\'server/src/__tests__/db-errors.test.ts\\']),(\\'typecheck\\',[\\'pnpm\\',\\'-r\\',\\'typecheck\\']),(\\'build\\',[\\'pnpm\\',\\'build\\']),(\\'previous-environment-failures\\',[\\'pnpm\\',\\'exec\\',\\'vitest\\',\\'run\\',\\'--exclude\\',\\'**/dist/**\\',\\'server/src/__tests__/cursor-local-adapter-environment.test.ts\\',\\'server/src/__tests__/cursor-local-execute.test.ts\\',\\'server/src/__tests__/file-delivery-bridges.test.ts\\',\\'server/src/__tests__/heartbeat-workspace-session.test.ts\\',\\'server/src/__tests__/paperclip-skill-utils.test.ts\\',\\'server/src/services/native-runtime/native-session-resume.test.ts\\',\\'server/src/services/native-runtime/runner-bridge-tools.test.ts\\']),(\\'full-test\\',[\\'pnpm\\',\\'test:run\\'])]\\n    for name,args in commands:\\n        before=verify();free=shutil.disk_usage(REPO).free\\n        assert free>4*1024**3, (\\'disk precondition <=4GiB\\',free)\\n        start=time.monotonic();log=R/f\\'{name}.log\\';cmd=[\\'python3\\',str(WRAPPER),*args]\\n        entry={\\'gate\\':name,\\'command\\':cmd,\\'status\\':\\'running\\',\\'snapshot_before\\':before,\\'free_before\\':free,\\'log\\':str(log)}\\n        report[\\'gates\\'].append(entry);report[\\'status\\']=\\'running\\';save();reason=None\\n        with log.open(\\'w\\') as f:\\n            p=subprocess.Popen(cmd,stdout=f,stderr=subprocess.STDOUT,start_new_session=True)\\n            while p.poll() is None:\\n                if shutil.disk_usage(REPO).free<700*1024**2:reason=\\'disk safety reserve below700MiB\\'\\n                if time.monotonic()-start>14400:reason=\\'bounded four-hour gate deadline\\'\\n                if reason:\\n                    os.killpg(p.pid,signal.SIGTERM)\\n                    try:p.wait(timeout=15)\\n                    except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.wait()\\n                    break\\n                time.sleep(5)\\n        text=log.read_text(errors=\\'replace\\')\\n        summaries=[line.strip() for line in text.splitlines() if re.search(r\\'^\\\\s*(Test Files|Tests|Duration)\\\\s\\',line)]\\n        entry.update(exit=p.returncode,seconds=round(time.monotonic()-start,2),reason=reason,status=\\'passed\\' if p.returncode==0 else \\'failed_or_incomplete\\',free_after=shutil.disk_usage(REPO).free,final_summary_lines=summaries,log_sha256=hashlib.sha256(log.read_bytes()).hexdigest(),snapshot_after=verify())\\n        save();print(json.dumps(entry),flush=True)\\n        if p.returncode!=0:\\n            report[\\'status\\']=\\'not_green\\';report[\\'failed_gate\\']=name;save();print(text[-16000:],flush=True);raise SystemExit(1)\\n    report[\\'snapshot_after\\']=verify();report[\\'status\\']=\\'complete\\';save();print(\\'All exact-commit canonical gates passed\\',flush=True)\\nexcept SystemExit:raise\\nexcept BaseException as e:\\n    report[\\'status\\']=\\'blocked\\';report[\\'exception\\']=repr(e);save();raise\\n')\nprint(json.dumps({'node':str(node),'rustup':str(rustup_home),'disk_free':shutil.disk_usage(repo).free,'variables':variables},indent=2))\nPYSETUP\n"
        },
        {
          "name": "Run exact-commit canonical gates in offline credential-free bwrap",
          "shell": "bash",
          "run": "python3 \"$GATE_EVIDENCE/gate_runner.py\""
        },
        {
          "name": "Preserve actual gate evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "pipeline-exact-snapshot-gates",
            "path": "${{ runner.temp }}/issue10311/evidence/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}