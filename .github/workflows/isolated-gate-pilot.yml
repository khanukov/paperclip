        {
          "name": "Prepare pinned Node runtime",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24.18.0",
            "package-manager-cache": false
          },
          "timeout-minutes": 5
        },
        {
          "name": "Prepare toolchain and offline dependency stores (no repository lifecycle scripts)",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 -I - <<'PYSETUP'\nimport pathlib,os,shutil,subprocess,json,sys,hashlib,functools\nrepo=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()\nw=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue10311'\nw.mkdir(parents=True,exist_ok=True)\nfor d in ['home','tmp','npm-cache','pnpm-store','evidence','tools','cargo/bin']:(w/d).mkdir(parents=True,exist_ok=True)\npayload='#!/usr/bin/python3\\n\"\"\"Approved bwrap layout adapted to an ephemeral offline gate runner.\\nNo host home, credentials, ambient environment, network or security overrides.\\n\"\"\"\\nimport os,subprocess,sys\\nfrom pathlib import Path\\nREPO=Path(os.environ[\\'GATE_REPO\\']).resolve()\\nNODE=Path(os.environ[\\'GATE_NODE\\']).resolve()\\nTOOL=Path(os.environ[\\'GATE_TOOL\\']).resolve()\\nWORK=Path(os.environ[\\'GATE_WORK\\']).resolve()\\nRUSTUP=Path(os.environ[\\'GATE_RUSTUP\\']).resolve()\\nfor p in [TOOL,WORK,*[WORK/x for x in [\\'home\\',\\'tmp\\',\\'npm-cache\\',\\'pnpm-store\\',\\'evidence\\',\\'cargo\\']]]:\\n    if p.is_symlink():raise SystemExit(\\'refuse symbolic bind source: \\'+str(p))\\n    p.mkdir(parents=True,exist_ok=True)\\nfor name in [\\'passwd\\',\\'group\\',\\'hosts\\',\\'nsswitch.conf\\']:\\n    p=WORK/name\\n    if p.is_symlink() or (p.exists() and not p.is_file()):raise SystemExit(\\'refuse unsafe metadata path: \\'+str(p))\\nmetadata={\\'passwd\\':\\'paperclip:x:1000:1000:Isolated test user:/work/home:/bin/sh\\\\n\\',\\'group\\':\\'paperclip:x:1000:\\\\n\\',\\'hosts\\':\\'127.0.0.1 localhost\\\\n::1 localhost\\\\n\\',\\'nsswitch.conf\\':\\'passwd: files\\\\ngroup: files\\\\nhosts: files dns\\\\n\\'}\\nfor name,text in metadata.items():\\n    fd=os.open(WORK/name,os.O_WRONLY|os.O_CREAT|os.O_TRUNC|os.O_NOFOLLOW,0o600)\\n    with os.fdopen(fd,\\'w\\') as f:f.write(text)\\nargs=sys.argv[1:]\\nif not args or args[0]==\\'--network\\':raise SystemExit(\\'offline command required\\')\\ncmd=[\\'bwrap\\',\\'--unshare-user\\',\\'--uid\\',\\'1000\\',\\'--gid\\',\\'1000\\',\\'--unshare-pid\\',\\'--unshare-ipc\\',\\'--unshare-uts\\',\\'--unshare-cgroup\\',\\'--die-with-parent\\',\\'--new-session\\',\\'--unshare-net\\']\\ncmd+=[\\'--ro-bind\\',\\'/usr\\',\\'/usr\\',\\'--tmpfs\\',\\'/usr/local\\',\\'--dir\\',\\'/usr/local/bin\\',\\'--symlink\\',\\'/opt/node/bin/node\\',\\'/usr/local/bin/node\\',\\'--symlink\\',\\'/opt/tools/node_modules/.bin/pnpm\\',\\'/usr/local/bin/pnpm\\',\\'--ro-bind\\',\\'/lib\\',\\'/lib\\',\\'--ro-bind\\',\\'/lib64\\',\\'/lib64\\',\\'--symlink\\',\\'usr/bin\\',\\'/bin\\',\\'--proc\\',\\'/proc\\',\\'--dev\\',\\'/dev\\',\\'--bind\\',str(WORK/\\'tmp\\'),\\'/tmp\\',\\'--tmpfs\\',\\'/root\\',\\'--dir\\',\\'/etc\\',\\'--ro-bind\\',\\'/etc/ssl/certs\\',\\'/etc/ssl/certs\\',\\'--ro-bind\\',\\'/etc/alternatives\\',\\'/etc/alternatives\\']\\ncmd+=[\\'--ro-bind\\',str(WORK/\\'passwd\\'),\\'/etc/passwd\\',\\'--ro-bind\\',str(WORK/\\'group\\'),\\'/etc/group\\',\\'--ro-bind\\',str(WORK/\\'hosts\\'),\\'/etc/hosts\\',\\'--ro-bind\\',str(WORK/\\'nsswitch.conf\\'),\\'/etc/nsswitch.conf\\',\\'--ro-bind\\',str(NODE),\\'/opt/node\\',\\'--ro-bind\\',str(RUSTUP),\\'/opt/rustup\\',\\'--ro-bind\\',str(TOOL),\\'/opt/tools\\',\\'--bind\\',str(REPO),\\'/repo\\',\\'--ro-bind\\',str(REPO/\\'.git\\'),\\'/repo/.git\\',\\'--ro-bind\\',str(WORK),\\'/work\\']\\nfor name in [\\'home\\',\\'tmp\\',\\'npm-cache\\',\\'pnpm-store\\',\\'cargo\\']:cmd+=[\\'--bind\\',str(WORK/name),\\'/work/\\'+name]\\ncmd+=[\\'--ro-bind\\',str(WORK/\\'evidence\\'),\\'/work/evidence\\',\\'--ro-bind\\',str(TOOL),\\'/work/tools\\',\\'--ro-bind\\',str(WORK/\\'cargo/bin\\'),\\'/work/cargo/bin\\',\\'--ro-bind\\',str(RUSTUP),\\'/work/rustup\\',\\'--chdir\\',\\'/repo\\',\\'--clearenv\\']\\nenv={\\'PATH\\':\\'/work/cargo/bin:/opt/tools/node_modules/.bin:/opt/node/bin:/repo/node_modules/.bin:/usr/local/bin:/usr/bin:/bin\\',\\'RUSTUP_HOME\\':\\'/opt/rustup\\',\\'RUSTUP_TOOLCHAIN\\':\\'1.97.1\\',\\'CARGO_HOME\\':\\'/work/cargo\\',\\'CARGO_NET_OFFLINE\\':\\'true\\',\\'CARGO_BUILD_JOBS\\':\\'2\\',\\'CARGO_PROFILE_DEV_DEBUG\\':\\'0\\',\\'CARGO_PROFILE_TEST_DEBUG\\':\\'0\\',\\'CC\\':\\'/usr/bin/gcc\\',\\'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER\\':\\'/usr/bin/gcc\\',\\'HOME\\':\\'/work/home\\',\\'USERPROFILE\\':\\'/work/home\\',\\'TMPDIR\\':\\'/work/tmp\\',\\'LANG\\':\\'C.UTF-8\\',\\'LC_ALL\\':\\'C.UTF-8\\',\\'HUSKY\\':\\'0\\',\\'npm_config_cache\\':\\'/work/npm-cache\\',\\'npm_config_userconfig\\':\\'/work/home/npm-user.rc\\',\\'npm_config_globalconfig\\':\\'/work/home/npm-global.rc\\',\\'npm_config_audit\\':\\'false\\',\\'npm_config_fund\\':\\'false\\',\\'PNPM_HOME\\':\\'/opt/tools/node_modules/.bin\\',\\'npm_config_store_dir\\':\\'/work/pnpm-store\\',\\'RAYON_NUM_THREADS\\':\\'2\\',\\'UV_THREADPOOL_SIZE\\':\\'2\\',\\'NODE_OPTIONS\\':\\'--max-old-space-size=3072\\',\\'CI\\':\\'true\\',\\'NO_COLOR\\':\\'1\\',\\'GIT_CONFIG_NOSYSTEM\\':\\'1\\',\\'GIT_CONFIG_GLOBAL\\':\\'/dev/null\\',\\'GIT_TERMINAL_PROMPT\\':\\'0\\',\\'GIT_DISCOVERY_ACROSS_FILESYSTEM\\':\\'1\\',\\'GIT_OPTIONAL_LOCKS\\':\\'0\\'}\\nfor k,v in env.items():cmd+=[\\'--setenv\\',k,v]\\ncmd+=[\\'--\\',*args]\\nraise SystemExit(subprocess.run(cmd).returncode)\\n'\nif hashlib.sha256(payload.encode()).hexdigest()!='65a02e634423debc4cec3180f39f593068e91e2a53fbbd55cf5cc158836b07a8':raise RuntimeError('embedded control drift')\n(w/'evidence'/'run_isolated.py').write_text(payload)\npayload='#!/usr/bin/python3\\n\"\"\"Verifier v2: frozen fixtures, offline execution, strict evidence and budgets.\\nNo repository imports. All discovery/execution is through the unchanged wrapper.\\nUnsupported discovery schemas block the gate rather than approximate coverage.\\n\"\"\"\\nimport collections, hashlib, json, math, os, re, shlex, shutil, signal, subprocess, sys, time\\nfrom pathlib import Path\\nTARGET=\\'4acc2caf6877ecdde83d38471aa593fdb06bda0a\\'\\nBASE=\\'2bfee409b407e97a8d3a62488f70b0ebfabe6cac\\'\\nDIFF=\\'933f5e869564e782c3d4dd028be20fda841c19ed6800421ed4303ce088e66ed1\\'\\nMANIFEST=\\'f8f12148e873d79223fd707e43254b69c338b982f536cd43e5b5fab2e367e6db\\'\\nWRAPPER=\\'65a02e634423debc4cec3180f39f593068e91e2a53fbbd55cf5cc158836b07a8\\'\\nPOLICY_SHA=\\'f5d63c87377e9dce76ca621aa1354af63035d62863295dd3b074e31b81249d09\\'\\nANSI=re.compile(r\\'\\\\x1b\\\\[[0-?]*[ -/]*[@-~]\\')\\n\\ndef digest(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()\\ndef clean(text):return ANSI.sub(\\'\\',text)\\ndef categories(body):\\n    counts={}\\n    for part in body.strip().split(\\'|\\'):\\n        m=re.fullmatch(r\\'\\\\s*(\\\\d+) (passed|failed|skipped|todo)\\\\s*\\',part)\\n        if not m:raise ValueError(\\'unrecognized summary part: \\'+part)\\n        n,k=m.groups()\\n        if k in counts:raise ValueError(\\'duplicate category: \\'+k)\\n        counts[k]=int(n)\\n    return counts\\n\\ndef final_counts(text):\\n    result=[]\\n    for line in clean(text).splitlines():\\n        if not re.match(r\\'\\\\s*(Test Files|Tests)\\\\s\\',line):continue\\n        m=re.fullmatch(r\\'\\\\s*(Test Files|Tests)\\\\s+(.+?)\\\\s*\\\\((\\\\d+)\\\\)\\\\s*\\',line)\\n        if not m:raise ValueError(\\'malformed summary marker\\')\\n        c=categories(m[2]);c[\\'total\\']=int(m[3])\\n        if sum(v for k,v in c.items() if k!=\\'total\\')!=c[\\'total\\']:raise ValueError(\\'summary count mismatch\\')\\n        result.append({\\'kind\\':m[1],\\'counts\\':c})\\n    return result\\n\\ndef summary_pair(text):\\n    summaries=final_counts(text)\\n    if [s[\\'kind\\'] for s in summaries]!=[\\'Test Files\\',\\'Tests\\']:raise ValueError(\\'exact ordered summary pair required\\')\\n    pair={s[\\'kind\\']:s[\\'counts\\'] for s in summaries}\\n    for c in pair.values():\\n        if c[\\'total\\']<=0 or c.get(\\'passed\\',0)+c.get(\\'failed\\',0)<=0:raise ValueError(\\'mandatory invocation has zero executed\\')\\n        if c.get(\\'todo\\',0):raise ValueError(\\'todo forbidden\\')\\n    return pair\\n\\nclass SkipCaps(dict):\\n    def __init__(self,values,fully_skipped):\\n        super().__init__(values);self.fully_skipped=set(fully_skipped)\\n\\ndef load_policy(path):\\n    if digest(path)!=POLICY_SHA:raise ValueError(\\'immutable skip policy drift\\')\\n    p=json.loads(Path(path).read_text());caps=p[\\'max_skipped_by_file\\']\\n    if len(caps)!=19 or sum(caps.values())!=82 or p[\\'max_skipped_tests\\']!=82:raise ValueError(\\'invalid baseline policy\\')\\n    fully_skipped=[row[\\'project\\']+\\'|\\'+row[\\'file\\'] for row in p[\\'rows\\'] if row[\\'skipped\\']==row[\\'tests\\']]\\n    if len(fully_skipped)!=8:raise ValueError(\\'invalid fully skipped baseline file set\\')\\n    return SkipCaps(caps,fully_skipped)\\n\\nROW=re.compile(r\\'^\\\\s*[\u2713\u276f\u2193\u00d7]\\\\s+\\\\|([^|]+)\\\\|\\\\s+(\\\\S+)\\\\s+\\\\((\\\\d+) tests?((?:\\\\s*\\\\|[^)]*)?)\\\\)(?:\\\\s+.*)?$\\')\\ndef file_rows(text):\\n    rows={}\\n    for line in clean(text).splitlines():\\n        m=ROW.fullmatch(line)\\n        if not m:continue\\n        project,file,total,parts=m.groups();key=project+\\'|\\'+file\\n        if key in rows:raise ValueError(\\'duplicate file result: \\'+key)\\n        c=categories(parts.lstrip().removeprefix(\\'|\\')) if parts else {}\\n        if \\'passed\\' in c:raise ValueError(\\'unsupported explicit passed row\\')\\n        c[\\'total\\']=int(total);c[\\'passed\\']=c[\\'total\\']-sum(c.get(k,0) for k in [\\'failed\\',\\'skipped\\',\\'todo\\'])\\n        if c[\\'passed\\']<0:raise ValueError(\\'invalid file result counts\\')\\n        rows[key]=c\\n    return rows\\n\\ndef validate_invocation(text,expected,caps):\\n    if not isinstance(expected,(list,set,tuple)) or not expected or len(expected)!=len(set(expected)):raise ValueError(\\'nonempty unique expected membership required\\')\\n    pair=summary_pair(text);rows=file_rows(text)\\n    if set(rows)!=set(expected):raise ValueError(\\'exact invocation membership mismatch\\')\\n    tests=collections.Counter();files=collections.Counter()\\n    for key,c in rows.items():\\n        if c[\\'total\\']<=0:raise ValueError(\\'zero test file\\')\\n        if c[\\'total\\']==c.get(\\'skipped\\',0) and key not in getattr(caps,\\'fully_skipped\\',set()):raise ValueError(\\'new entirely skipped file: \\'+key)\\n        if c.get(\\'skipped\\',0)>caps.get(key,0):raise ValueError(\\'new/increased file skip: \\'+key)\\n        if c.get(\\'todo\\',0):raise ValueError(\\'todo forbidden\\')\\n        tests.update(c)\\n        category=\\'failed\\' if c.get(\\'failed\\',0) else (\\'skipped\\' if c[\\'total\\']==c.get(\\'skipped\\',0) else \\'passed\\')\\n        files.update({category:1,\\'total\\':1})\\n    for kind,observed in [(\\'Tests\\',tests),(\\'Test Files\\',files)]:\\n        for k in [\\'total\\',\\'passed\\',\\'failed\\',\\'skipped\\',\\'todo\\']:\\n            if observed[k]!=pair[kind].get(k,0):raise ValueError(\\'file/summary reconciliation mismatch: \\'+kind+\\' \\'+k)\\n    if tests[\\'skipped\\']>82:raise ValueError(\\'skip aggregate over baseline\\')\\n    return {\\'pair\\':pair,\\'files\\':rows,\\'green\\':not any(c.get(\\'failed\\',0) for c in pair.values())}\\n\\ndef completed_invocations(text):\\n    result=[]\\n    for block in re.split(r\\'(?m)^\\\\[test:run\\\\] \\',clean(text))[1:]:\\n        label=block.splitlines()[0]\\n        if final_counts(block):summary_pair(block);result.append(label)\\n    return result\\n\\ndef parse_canonical(text,expected,caps,administrative=()):\\n    parsed={};pending=[];seen_admin=set()\\n    for block in re.split(r\\'(?m)^\\\\[test:run\\\\] \\',clean(text))[1:]:\\n        label=block.splitlines()[0]\\n        if label in administrative:\\n            if label in seen_admin or final_counts(block) or file_rows(block):raise ValueError(\\'invalid administrative block\\')\\n            seen_admin.add(label);continue\\n        if label not in expected or label in parsed or label in pending:raise ValueError(\\'unknown/duplicate invocation label\\')\\n        if final_counts(block):parsed[label]=validate_invocation(block,expected[label],caps)\\n        else:pending.append(label)\\n    return {\\'invocations\\':parsed,\\'pending\\':pending,\\'green\\':set(parsed)==set(expected) and not pending and all(p[\\'green\\'] for p in parsed.values())}\\n\\nclass Budget:\\n    def __init__(self,seconds,clock=time.monotonic):\\n        self.clock=clock;self.deadline=clock()+seconds\\n    def remaining(self,limit=None,reserve=0):\\n        remaining=self.deadline-self.clock()-reserve\\n        if not math.isfinite(remaining) or remaining<=0:raise TimeoutError(\\'overall deadline exhausted\\')\\n        return min(remaining,limit) if limit is not None else remaining\\n\\ndef finish_integrity(report,preparation,prep_sha,controls):\\n    \"\"\"Never mask an active exception; caller rethrows original after saving.\"\"\"\\n    integrity={};errors=[];incomplete=[]\\n    targets={\\'preparation\\':(preparation,prep_sha)}\\n    targets.update({\\'control:\\'+n:(n,h) for n,h in controls.items()})\\n    for e in report[\\'gates\\']:\\n        if not e.get(\\'log_sha256\\') or e.get(\\'exit\\') is None or e.get(\\'status\\') in (\\'running\\',\\'incomplete\\'):\\n            incomplete.append(e[\\'gate\\'])\\n        targets[\\'log:\\'+e[\\'gate\\']]=(e[\\'log\\'],e.get(\\'log_sha256\\'))\\n    for name,(path,sha) in targets.items():\\n        try:integrity[name]=bool(sha) and digest(path)==sha\\n        except BaseException as ex:integrity[name]=False;errors.append(name+\\': \\'+repr(ex))\\n    report[\\'evidence_integrity_before_upload\\']=integrity\\n    report[\\'evidence_without_completed_gate_digest\\']=incomplete\\n    report[\\'integrity_errors\\']=errors\\n    if incomplete or not all(integrity.values()):report.update(status=\\'blocked\\',green_gate=False)\\n    elif any(e.get(\\'status\\')!=\\'passed\\' or e.get(\\'exit\\')!=0 or e.get(\\'reason\\') for e in report[\\'gates\\']):\\n        report[\\'green_gate\\']=False\\n        if report.get(\\'status\\')!=\\'blocked\\':report[\\'status\\']=\\'not_green\\'\\n    return not incomplete and all(integrity.values())\\n\\ndef run_command(entry,cmd,log,budget,verify,parse,save,free=lambda:10**12,limit=14400,launch=subprocess.Popen):\\n    \"\"\"Finalize execution fields and persist them BEFORE fallible validators.\"\"\"\\n    budget.remaining(reserve=25);entry.update(status=\\'incomplete\\',exit=None,reason=\\'not_started\\',seconds=0,log_sha256=None)\\n    entry[\\'snapshot_before\\']=verify();budget.remaining(reserve=25)\\n    if free()<=4*1024**3:raise RuntimeError(\\'disk precondition <=4GiB\\')\\n    command_deadline=budget.clock()+budget.remaining(limit,reserve=25)\\n    process=None;started=budget.clock();original=None\\n    try:\\n        with Path(log).open(\\'x\\') as stream:\\n            entry.update(status=\\'running\\',reason=\\'launch_pending\\');save()\\n            budget.remaining(reserve=25)\\n            process=launch(cmd,stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)\\n            entry[\\'reason\\']=None\\n            while process.poll() is None:\\n                if budget.clock()>=command_deadline:entry[\\'reason\\']=\\'command/overall deadline\\'\\n                elif free()<700*1024**2:entry[\\'reason\\']=\\'disk reserve below700MiB\\'\\n                if entry[\\'reason\\']:break\\n                time.sleep(min(0.5,max(0,command_deadline-budget.clock())))\\n    except BaseException as ex:\\n        original=ex;entry[\\'reason\\']=\\'interrupted: \\'+repr(ex)\\n    finally:\\n        if process is not None:\\n            try:\\n                if process.poll() is None:\\n                    try:os.killpg(process.pid,signal.SIGTERM)\\n                    except ProcessLookupError:pass\\n                    try:process.wait(timeout=20)\\n                    except subprocess.TimeoutExpired:\\n                        try:os.killpg(process.pid,signal.SIGKILL)\\n                        except ProcessLookupError:pass\\n                        process.wait(timeout=3)\\n            except BaseException as ex:\\n                entry[\\'termination_error\\']=repr(ex)\\n                if original is None:original=ex\\n                if entry[\\'reason\\'] is None:entry[\\'reason\\']=\\'termination incomplete\\'\\n            entry[\\'exit\\']=process.returncode\\n        entry[\\'seconds\\']=round(budget.clock()-started,6)\\n        try:entry[\\'log_sha256\\']=digest(log)\\n        except BaseException as ex:entry[\\'log_error\\']=repr(ex)\\n        entry[\\'status\\']=\\'executed\\' if process is not None and entry[\\'exit\\'] is not None else \\'incomplete\\'\\n        try:save()\\n        except BaseException as ex:\\n            entry[\\'evidence_save_error\\']=repr(ex)\\n            if original is None:original=ex\\n    if original is not None:raise original\\n    if entry[\\'reason\\']:raise RuntimeError(entry[\\'reason\\'])\\n    try:\\n        budget.remaining();entry[\\'snapshot_after\\']=verify();entry[\\'parsed\\']=parse(Path(log).read_text(errors=\\'replace\\'))\\n        pairs=[p[\\'pair\\'] for p in entry[\\'parsed\\'].get(\\'invocations\\',{}).values()]\\n        if \\'pair\\' in entry[\\'parsed\\']:pairs.append(entry[\\'parsed\\'][\\'pair\\'])\\n        entry[\\'final_counts\\']=[{\\'kind\\':kind,\\'counts\\':counts} for pair in pairs for kind,counts in pair.items()]\\n        entry[\\'completed_invocations\\']=list(entry[\\'parsed\\'].get(\\'invocations\\',{}))\\n        entry[\\'status\\']=\\'passed\\' if entry[\\'exit\\']==0 and entry[\\'parsed\\'].get(\\'green\\',True) else \\'failed\\'\\n    except BaseException as ex:\\n        entry.update(status=\\'validation_failed\\',validation_error=repr(ex))\\n        try:save()\\n        except BaseException as secondary:entry[\\'evidence_save_error\\']=repr(secondary)\\n        raise\\n    save();return entry,Path(log).read_text(errors=\\'replace\\')\\n\\ndef validate_inventory(inventory,server,workspace,groups,shards):\\n    ser